  <script>
    /* Оформление применяем до отрисовки, чтобы не мигало */
    try {
      var m = location.hash.match(/skin=(brand|plain)/);
      var s = m ? m[1] : localStorage.getItem('espada-skin');
      if (s !== 'plain') document.documentElement.setAttribute('data-skin', 'brand'); /* фирменное — по умолчанию */
    } catch (e) { /* без сохранённого выбора */ }
  </script>
